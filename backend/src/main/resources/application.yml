server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: student-management-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/student_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${SMS_MAIL_HOST:}
    port: ${SMS_MAIL_PORT:587}
    username: ${SMS_MAIL_USERNAME:}
    password: ${SMS_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMS_MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${SMS_MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
app.jwt-secret: ${JWT_SECRET:local-only-change-this-secret-to-a-random-value}
sms.mail.from: ${SMS_MAIL_FROM:}
sms.mail.login-url: ${SMS_PUBLIC_APP_URL:http://localhost:8080/login}
management:
  endpoints.web.exposure.include: health,info
  health.mail.enabled: false
  endpoint.health.show-details: never
springdoc:
  swagger-ui.path: /swagger-ui.html
---
spring:
  config.activate.on-profile: test
  datasource:
    url: jdbc:h2:mem:sms;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway.enabled: false
  jpa.hibernate.ddl-auto: create-drop
app.jwt-secret: test-only-secret-value-for-jwt-verification
---
spring:
  config.activate.on-profile: prod
  datasource.url: ${DB_URL}
  datasource.username: ${DB_USER}
  datasource.password: ${DB_PASSWORD}
  jpa.hibernate.ddl-auto: validate
app.jwt-secret: ${JWT_SECRET}
