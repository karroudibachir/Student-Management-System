services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-student_management}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-student_management}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DDL_AUTO: validate
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8180/realms/student-management}
      OIDC_JWKS_URI: http://keycloak:8080/realms/student-management/protocol/openid-connect/certs
      SMS_BOOTSTRAP_ADMIN_EMAIL: ${SMS_BOOTSTRAP_ADMIN_EMAIL:-}
    depends_on:
      mysql: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://backend:8081}
      OIDC_AUTH_URL: ${OIDC_AUTH_URL:-http://localhost:8180}
      OIDC_REALM: ${OIDC_REALM:-student-management}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-sms-frontend}
    ports: ["${APP_PORT:-8080}:80"]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?Set KEYCLOAK_ADMIN_USER in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    ports: ["${KEYCLOAK_PORT:-8180}:8080"]
    restart: unless-stopped
volumes:
  mysql_data:
