services:
  - type: web
    name: student-management-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_JWKS_URI
        sync: false
      - key: SMS_BOOTSTRAP_ADMIN_EMAIL
        sync: false
  - type: web
    name: student-management-frontend
    runtime: docker
    plan: free
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: CORS_ORIGIN
        sync: false
      - key: BACKEND_ORIGIN
        sync: false
      - key: OIDC_AUTH_URL
        sync: false
      - key: OIDC_REALM
        value: student-management
      - key: OIDC_CLIENT_ID
        value: sms-frontend
